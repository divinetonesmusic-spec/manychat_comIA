name: Cópia semanal do banco

# Toda semana (domingo, 06:23 UTC) e na mão: copia o banco do Supabase (schema public, onde ficam todos os
# dados do UaiFlow), compacta, criptografa com a senha BACKUP_PASSPHRASE e guarda aqui no GitHub por 90 dias.
# O repositório é público: a cópia NUNCA sobe sem criptografia, e a URL do banco nunca aparece no registro.
# Passo a passo (criar os segredos, baixar e abrir uma cópia): docs/AVISOS_E_COPIA.md
on:
  schedule:
    - cron: "23 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Conferir os segredos
        id: segredos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning title=Cópia não feita::Falta o segredo SUPABASE_DB_URL no GitHub (Settings > Secrets and variables > Actions). Nada foi copiado. Passo a passo em docs/AVISOS_E_COPIA.md."
            echo "fazer=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error title=Falta a senha da cópia::Crie o segredo BACKUP_PASSPHRASE no GitHub. Sem ele a cópia não é feita: ela nunca sobe sem criptografia."
            exit 1
          fi
          echo "fazer=sim" >> "$GITHUB_OUTPUT"

      - name: Baixar o pg_dump (imagem postgres:17)
        if: steps.segredos.outputs.fazer == 'sim'
        run: docker pull -q postgres:17

      - name: Copiar, compactar e criptografar
        id: copia
        if: steps.segredos.outputs.fazer == 'sim'
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # O registro do GitHub é público e ele só esconde o segredo inteiro. Um erro do pg_dump pode repetir
          # pedaços da senha (ex.: senha com % ou @ sem codificar). Por isso: (1) o usuário e a senha são
          # escondidos (::add-mask::) inteiros e em pedaços, e (2) o erro do pg_dump vai para um arquivo que
          # nunca é mostrado; no registro sai só uma mensagem fixa.
          mascarar() {
            local valor="$1"
            [ "${#valor}" -ge 3 ] || return 0
            valor="${valor//'%'/%25}"
            valor="${valor//$'\r'/%0D}"
            valor="${valor//$'\n'/%0A}"
            echo "::add-mask::$valor"
          }
          credenciais="${SUPABASE_DB_URL#*://}"
          case "$credenciais" in
            *@*) credenciais="${credenciais%@*}" ;;
            *) credenciais="" ;;
          esac
          if [ -n "$credenciais" ]; then
            mascarar "$credenciais"
            senha="${credenciais#*:}"
            mascarar "$senha"
            if decodificada="$(printf '%b' "${senha//'%'/\\x}" 2> /dev/null)" && [ "$decodificada" != "$senha" ]; then mascarar "$decodificada"; fi
            IFS='@:/%' read -r -a pedacos <<< "$credenciais"
            for pedaco in "${pedacos[@]}"; do mascarar "$pedaco"; done
          fi
          unset credenciais senha decodificada pedacos pedaco

          nome="uaiflow-banco-$(date -u +%Y-%m-%d)"
          arquivo="$nome.sql.gz.enc"
          erros="erros-do-pg_dump.txt"
          # pg_dump do Postgres 17 (copia servidores 15, 16 e 17). A URL entra no container pelo nome da
          # variável (-e), nunca na linha de comando; a senha da cópia vai para o openssl pelo ambiente.
          set +e
          docker run --rm -e SUPABASE_DB_URL postgres:17 \
            sh -c 'exec pg_dump --dbname="$SUPABASE_DB_URL" --no-owner --no-privileges --schema=public' 2> "$erros" \
            | gzip -9 \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -pass env:BACKUP_PASSPHRASE -out "$arquivo"
          estados=("${PIPESTATUS[@]}")
          set -e

          if [ "${estados[0]}" != "0" ]; then
            if grep -Eqi 'invalid percent-encoded|invalid integer value|could not translate host name|invalid URI|missing "=" after|invalid connection option' "$erros"; then
              motivo="O endereço em SUPABASE_DB_URL está mal formado. Se a senha do banco tem caracteres especiais (@ : / % # ? &), copie o DATABASE_URL do Netlify e troque só a porta 6543 por 5432 (docs/AVISOS_E_COPIA.md, Parte 5)."
            elif grep -Eqi 'password authentication failed|Tenant or user not found|no pg_hba.conf entry' "$erros"; then
              motivo="O Supabase recusou o usuário ou a senha do SUPABASE_DB_URL. Confira a senha do banco e atualize o segredo."
            elif grep -Eqi 'timeout|timed out|Connection refused|could not connect|Network is unreachable|server closed the connection' "$erros"; then
              motivo="O banco não respondeu. Confira se o projeto do Supabase não está pausado e se o endereço é o do Session pooler (porta 5432)."
            elif grep -Eqi 'server version mismatch' "$erros"; then
              motivo="O Postgres do Supabase é mais novo que o pg_dump da imagem postgres:17. Troque a imagem no backup.yml por uma versão mais nova."
            else
              motivo="O pg_dump não conseguiu copiar o banco. Por segurança o erro original não é mostrado (ele pode conter partes da senha). Confira o SUPABASE_DB_URL."
            fi
            rm -f "$erros"
            echo "::error title=A cópia falhou::$motivo"
            exit 1
          fi
          rm -f "$erros"
          if [ "${estados[1]}" != "0" ] || [ "${estados[2]}" != "0" ]; then
            echo "::error title=A cópia falhou::Não consegui compactar ou criptografar a cópia."
            exit 1
          fi

          # Confere a cópia: abre de novo com a mesma senha e testa o gzip.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:BACKUP_PASSPHRASE -in "$arquivo" | gzip -t
          echo "Cópia pronta e conferida: $arquivo ($(du -h "$arquivo" | cut -f1))."
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "arquivo=$arquivo" >> "$GITHUB_OUTPUT"

      - name: Guardar a cópia criptografada (90 dias)
        if: steps.segredos.outputs.fazer == 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.copia.outputs.nome }}
          path: ${{ steps.copia.outputs.arquivo }}
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: Avisar no Telegram que a cópia falhou
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXECUCAO_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Sem os segredos TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID no GitHub: o aviso fica só no e-mail do GitHub."
            exit 0
          fi
          texto=$(printf 'UaiFlow: a cópia semanal do banco falhou.\nVeja o que aconteceu: %s' "$EXECUCAO_URL")
          resposta=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${texto}" \
            -d "disable_web_page_preview=true") || resposta="000"
          if [ "$resposta" = "200" ]; then echo "Aviso enviado no Telegram."; else echo "::warning::Não consegui mandar o aviso no Telegram (resposta $resposta)."; fi
