name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-secret-placeholder
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          APP_BASE_URL: https://example.com
          ADMIN_PASSWORD: ci-password-placeholder
          ADMIN_SESSION_SECRET: ci-session-placeholder-with-more-than-32-characters
          WORKER_SECRET: ci-worker-placeholder-with-more-than-32-characters
          INSTAGRAM_APP_ID: "123456789"
          INSTAGRAM_APP_SECRET: ci-meta-placeholder
          INSTAGRAM_REDIRECT_URI: https://example.com/api/oauth/callback
          WEBHOOK_VERIFY_TOKEN: ci-webhook-placeholder-with-more-than-32-characters

  # Testes automáticos (npm test) com um Postgres 16 só para eles. Cada arquivo de teste cria e apaga o
  # seu próprio banco (tests/helpers/db.mts). Nenhum teste pode ser pulado aqui.
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TESTES_EXIGEM_BANCO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Testes (com banco; nenhum pode ser pulado)
        shell: bash
        run: |
          npm test 2>&1 | tee resultado-dos-testes.txt
          if grep -Eq '# SKIP|^[[:space:]]*﹣ ' resultado-dos-testes.txt; then
            echo "::error::Algum teste foi pulado. Na CI todos os testes precisam rodar."
            exit 1
          fi
